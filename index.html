<!doctype html>
<html lang="vi">
<head>
<title>Ôn Tập Tiếng Anh 2</title>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;600;700;800&family=Nunito:wght@400;600;700;800&display=swap">
<style>
/* Layout: sticky navy header with tab bar; ivory content canvas; cards on white; gold = action accent, teal = correct, coral = wrong */
:root{
  --navy:#182a4d; --navy2:#22396a; --gold:#e0a82e; --gold-d:#b98512; --teal:#168a7d; --coral:#e0584a;
  --bg:#f5f7fb; --card:#ffffff; --ink:#1c2740; --mute:#5d6a86; --line:#dfe5f0; --soft:#eaf0fb; --softgold:#fff4d6;
  --head:#182a4d; --headink:#ffffff; --ok-bg:#dff5ee; --bad-bg:#fde6e3;
  --fd:'Baloo 2','Nunito',system-ui,sans-serif; --fb:'Nunito',system-ui,sans-serif;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0f1729; --card:#18233c; --ink:#eef2fb; --mute:#a3afcb; --line:#2b3a5c; --soft:#1f2d4d; --softgold:#3a3017;
  --head:#0b1222; --ok-bg:#12372f; --bad-bg:#43211f; --gold:#f0bb48; --navy:#9fb7ee; --navy2:#6f8fe0; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0f1729; --card:#18233c; --ink:#eef2fb; --mute:#a3afcb; --line:#2b3a5c; --soft:#1f2d4d; --softgold:#3a3017;
  --head:#0b1222; --ok-bg:#12372f; --bad-bg:#43211f; --gold:#f0bb48; --navy:#9fb7ee; --navy2:#6f8fe0; color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--fb);font-size:16px;line-height:1.5;margin:0}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);background:var(--head);z-index:30}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,input:focus-visible,a:focus-visible{outline:3px solid var(--gold);outline-offset:2px}
.wrap{max-width:1080px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
header{background:var(--head);color:var(--headink);position:sticky;top:env(safe-area-inset-top,0px);z-index:20;box-shadow:0 2px 14px rgba(10,20,50,.25)}
.top{display:flex;align-items:center;gap:12px;padding-block:10px;flex-wrap:wrap}
.brand{font-family:var(--fd);font-weight:800;font-size:1.45rem;letter-spacing:.2px;display:flex;align-items:center;gap:10px;margin-right:auto}
.brand i{font-style:normal;display:grid;place-items:center;width:38px;height:38px;border-radius:50%;background:var(--gold);color:#182a4d;font-size:1.3rem}
.brand small{display:block;font-family:var(--fb);font-weight:600;font-size:.72rem;opacity:.75;letter-spacing:.08em;text-transform:uppercase}
.stars{background:rgba(255,255,255,.12);padding:5px 14px;border-radius:99px;font-weight:800;color:#ffd770}
nav{display:flex;gap:6px;overflow-x:auto;padding-bottom:10px;scrollbar-width:none}
nav::-webkit-scrollbar{display:none}
nav button{flex:0 0 auto;background:transparent;border:0;color:#cdd8f2;padding:9px 18px;border-radius:99px;font-weight:800;font-size:1rem}
nav button:hover{background:rgba(255,255,255,.1)}
nav button[aria-current="page"]{background:var(--gold);color:#182a4d}
main{padding-block:22px 60px}
h1,h2,h3{font-family:var(--fd);line-height:1.2;text-wrap:balance;margin:0}
h2{font-size:1.7rem;color:var(--navy)} h3{font-size:1.2rem}
.sub{color:var(--mute);margin:4px 0 18px}
.card{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:18px}
.chips{display:flex;gap:8px;flex-wrap:wrap;margin:10px 0 18px}
.chip{border:1.5px solid var(--line);background:var(--card);padding:7px 15px;border-radius:99px;font-weight:700;color:var(--ink)}
.chip[aria-pressed="true"]{background:var(--navy);border-color:var(--navy);color:#fff}
:root[data-theme="dark"] .chip[aria-pressed="true"]{color:#0b1222}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .chip[aria-pressed="true"]{color:#0b1222}}
.btn{background:var(--gold);color:#182a4d;border:0;border-radius:14px;padding:11px 22px;font-weight:800;box-shadow:0 3px 0 var(--gold-d)}
.btn:active{transform:translateY(2px);box-shadow:0 1px 0 var(--gold-d)}
.btn.alt{background:var(--soft);color:var(--ink);box-shadow:0 3px 0 var(--line)}
.btn[disabled]{opacity:.5;cursor:default}
.spk{width:42px;height:42px;border-radius:50%;border:0;background:var(--navy);color:#fff;display:inline-grid;place-items:center;flex:none;font-size:1.1rem}
:root[data-theme="dark"] .spk{color:#0b1222}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .spk{color:#0b1222}}
.spk.big{width:64px;height:64px;font-size:1.6rem;background:var(--gold);color:#182a4d}
/* home */
.hero>*{min-width:0}
.hero{display:grid;grid-template-columns:minmax(0,1.1fr) minmax(0,1fr);gap:22px;align-items:center;background:linear-gradient(135deg,var(--navy2),var(--head));color:#fff;border-radius:24px;padding:28px}
.hero h1{font-size:clamp(1.8rem,4.5vw,2.8rem);color:#fff}
.hero p{opacity:.88;max-width:46ch}
.hero .gal{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.hero .gal span{background:#fff;border-radius:14px;aspect-ratio:1;display:grid;place-items:center;padding:6px}
.hero .gal span{min-width:0;overflow:hidden}.hero .gal img{max-width:100%;max-height:100%;object-fit:contain}
.tiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:14px;margin-top:20px}
.tile{text-align:left;background:var(--card);border:1px solid var(--line);border-radius:20px;padding:18px;display:flex;flex-direction:column;gap:8px;border-top:6px solid var(--gold)}
.tile:hover{transform:translateY(-2px);box-shadow:0 8px 20px rgba(20,40,90,.12)}
.tile b{font-family:var(--fd);font-size:1.35rem;color:var(--navy)} .tile span{color:var(--mute);font-size:.95rem}
.tile:nth-child(2){border-top-color:var(--teal)} .tile:nth-child(3){border-top-color:var(--coral)} .tile:nth-child(4){border-top-color:var(--navy2)}
/* vocab */
.vgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(168px,1fr));gap:14px}
.vcard{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:10px 10px 14px;text-align:center}
.vcard .pic{background:#fff;border-radius:12px;height:130px;display:grid;place-items:center;padding:6px;border:1px solid var(--line)}
.vcard .pic img{max-height:118px;object-fit:contain}
.vcard b{display:block;font-family:var(--fd);font-size:1.45rem;margin-top:8px;color:var(--navy)}
.vcard small{color:var(--mute);display:block}
.vcard .row{display:flex;justify-content:center;gap:8px;margin-top:8px}
.ubadge{display:inline-block;background:var(--softgold);color:var(--gold-d);font-weight:800;font-size:.78rem;border-radius:8px;padding:1px 8px}
:root[data-theme="dark"] .ubadge{color:var(--gold)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .ubadge{color:var(--gold)}}
/* flash modal */
.flash{display:grid;gap:14px;justify-items:center;text-align:center}
.flash .pic{background:#fff;border:1px solid var(--line);border-radius:20px;width:min(380px,100%);height:260px;display:grid;place-items:center;padding:10px}
.flash .pic img{max-height:240px;object-fit:contain}
.flash .w{font-family:var(--fd);font-size:3rem;font-weight:800;color:var(--navy);line-height:1}
/* patterns */
.pat{display:grid;gap:14px}
.pcard{display:grid;grid-template-columns:220px 1fr;gap:16px;background:var(--card);border:1px solid var(--line);border-radius:20px;padding:16px}
.pcard .pics{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;align-content:start}
.pcard .pics span{background:#fff;border:1px solid var(--line);border-radius:10px;aspect-ratio:1;display:grid;place-items:center;padding:3px}
.pcard .pics img{max-height:100%;object-fit:contain}
.sline{display:flex;align-items:center;gap:10px;padding:6px 0;border-bottom:1px dashed var(--line);min-width:0}
.sline:last-child{border:0}
.sline .en{font-weight:800;font-size:1.12rem;flex:1;min-width:0}
.sline .vi{color:var(--mute);font-size:.9rem;display:block;font-weight:600}
.key{font-family:var(--fd);background:var(--softgold);border-radius:12px;padding:8px 14px;font-size:1.15rem;color:var(--ink);margin:6px 0 10px;display:inline-block}
/* games */
.gtiles{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:12px}
.gt{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:14px;text-align:left;display:flex;gap:12px;align-items:center}
.gt:hover{border-color:var(--gold);transform:translateY(-2px)}
.gt .ic{width:46px;height:46px;border-radius:14px;display:grid;place-items:center;font-size:1.4rem;background:var(--softgold);flex:none}
.gt b{display:block;font-family:var(--fd);font-size:1.08rem} .gt small{color:var(--mute);line-height:1.25;display:block}
.stage{max-width:760px;margin:0 auto}
.bar{height:10px;background:var(--soft);border-radius:9px;overflow:hidden;margin:6px 0 16px}
.bar i{display:block;height:100%;background:linear-gradient(90deg,var(--gold),var(--teal));transition:width .3s}
.qh{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap}
.q{background:var(--card);border:1px solid var(--line);border-radius:20px;padding:18px}
.q .instr{font-weight:800;color:var(--mute);margin-bottom:10px}
.opts{display:grid;grid-template-columns:repeat(auto-fit,minmax(120px,1fr));gap:10px;margin-top:12px}
.opt{background:var(--card);border:2px solid var(--line);border-radius:16px;padding:8px;font-weight:800;font-size:1.15rem;min-height:56px;display:grid;place-items:center}
.opt.img{background:#fff;height:128px;padding:4px}
.opt img{max-height:112px;object-fit:contain}
.opt:hover{border-color:var(--gold)}
.opt.sel{border-color:var(--navy2);box-shadow:0 0 0 3px var(--soft)}
.opt.ok,.ok .opt.sel{border-color:var(--teal);background:var(--ok-bg);color:var(--ink)}
.opt.bad{border-color:var(--coral);background:var(--bad-bg)}
.opt.img.ok{background:#fff}
.q .pic{background:#fff;border:1px solid var(--line);border-radius:14px;height:180px;width:min(280px,100%);display:grid;place-items:center;margin:4px auto 12px;padding:6px}
.q .pic img{max-height:166px;object-fit:contain}
.sent{font-size:1.25rem;font-weight:800;text-align:center;margin:6px 0;white-space:pre-line}
.blank{display:inline-block;min-width:90px;border-bottom:3px solid var(--gold);text-align:center;color:var(--navy2)}
.boxes{display:inline-flex;gap:4px;vertical-align:middle;flex-wrap:wrap;justify-content:center}
.boxes input,.boxes .fx{width:36px;height:44px;text-align:center;font:800 1.3rem var(--fd);border:2px solid var(--line);border-radius:10px;background:var(--card);color:var(--ink);padding:0}
.boxes .fx{display:grid;place-items:center;background:var(--softgold);border-color:transparent}
.boxes input.ok{border-color:var(--teal);background:var(--ok-bg)} .boxes input.bad{border-color:var(--coral);background:var(--bad-bg)}
.bank,.ans{display:flex;gap:8px;flex-wrap:wrap;min-height:54px;padding:8px;border-radius:14px;margin-top:10px;justify-content:center}
.ans{background:var(--soft);border:2px dashed var(--line)}
.ans.ok{border-color:var(--teal);background:var(--ok-bg)} .ans.bad{border-color:var(--coral);background:var(--bad-bg)}
.tk{background:var(--card);border:2px solid var(--navy2);border-radius:12px;padding:6px 14px;font-weight:800;font-size:1.1rem}
.fb{min-height:28px;text-align:center;font-weight:800;margin-top:10px}
.fb.good{color:var(--teal)} .fb.no{color:var(--coral)}
.actions{display:flex;gap:10px;justify-content:center;margin-top:14px;flex-wrap:wrap}
.result{text-align:center;padding:26px}
.result .big{font-family:var(--fd);font-size:3.2rem;font-weight:800;color:var(--navy)}
.stars-row{font-size:2.2rem;letter-spacing:4px}
/* matching / memory */
.mm{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.mm .col{display:grid;gap:10px}
.mm .opt.img{height:96px} .mm .opt.img img{max-height:86px}
.mm .opt.done{opacity:.35;pointer-events:none}
.mem{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}
.mc{aspect-ratio:1;border-radius:16px;border:2px solid var(--line);background:linear-gradient(135deg,var(--navy2),var(--head));color:#ffd770;font:800 2rem var(--fd);display:grid;place-items:center;padding:4px;perspective:600px}
.mc.up{background:#fff;color:#182a4d;font-size:1.05rem}
.mc.up img{max-height:100%;object-fit:contain}
.mc.done{border-color:var(--teal);background:var(--ok-bg);color:var(--ink)}
.mc.done img{max-height:100%}
/* hangman */
.hm{display:flex;flex-direction:column;align-items:center;gap:12px}
.hmword{display:flex;gap:6px;flex-wrap:wrap;justify-content:center}
.hmword span{width:38px;height:48px;border-bottom:4px solid var(--navy2);font:800 1.8rem var(--fd);text-align:center}
.kb{display:flex;flex-wrap:wrap;gap:6px;justify-content:center;max-width:520px}
.kb button{width:42px;height:44px;border-radius:10px;border:2px solid var(--line);background:var(--card);font-weight:800}
.kb button.ok{background:var(--ok-bg);border-color:var(--teal)} .kb button.bad{background:var(--bad-bg);border-color:var(--coral);opacity:.6}
.hearts{font-size:1.5rem;letter-spacing:3px}
/* wordsearch */
.ws{display:grid;gap:3px;justify-content:center;margin:10px auto;user-select:none}
.ws button{width:min(38px,9vw);height:min(38px,9vw);border-radius:8px;border:1px solid var(--line);background:var(--card);font:800 1.05rem var(--fd);padding:0}
.ws button.st{background:var(--gold);color:#182a4d}
.ws button.fd{background:var(--ok-bg);border-color:var(--teal)}
.wl{display:flex;gap:8px;flex-wrap:wrap;justify-content:center}
.wl span{padding:4px 12px;border-radius:99px;background:var(--soft);font-weight:800}
.wl span.fd{background:var(--ok-bg);text-decoration:line-through;color:var(--teal)}
/* ttt */
.ttt{display:grid;grid-template-columns:repeat(3,92px);gap:8px;justify-content:center;margin:12px auto}
.ttt button{width:92px;height:92px;border-radius:16px;border:2px solid var(--line);background:var(--card);font:800 2.8rem var(--fd);padding:0}
.ttt button.X{color:var(--teal)} .ttt button.O{color:var(--coral)}
/* tests */
.tgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(250px,1fr));gap:14px}
.tcard{background:var(--card);border:1px solid var(--line);border-radius:20px;padding:20px;display:flex;flex-direction:column;gap:8px;text-align:left}
.tcard h3{color:var(--navy)} .tcard p{margin:0;color:var(--mute);flex:1}
.paper{background:var(--card);border:1px solid var(--line);border-radius:22px;padding:22px;max-width:820px;margin:0 auto}
.stu{display:grid;grid-template-columns:1fr 1fr 150px;gap:10px;margin:14px 0}
.stu label{font-weight:800;font-size:.85rem;color:var(--mute);display:block}
.stu input{width:100%;border:0;border-bottom:2px solid var(--line);background:transparent;padding:6px 2px;font:700 1.05rem var(--fb);color:var(--ink)}
.stu .mark{font-family:var(--fd);font-weight:800;font-size:1.5rem;color:var(--teal);padding-top:14px}
.sec{margin-top:26px}
.sec>h3{display:flex;align-items:center;gap:10px;margin-bottom:12px;color:var(--navy)}
.sec>h3 b{width:34px;height:34px;border-radius:50%;background:var(--gold);color:#182a4d;display:grid;place-items:center;font-family:var(--fd)}
.sec .q{margin-bottom:12px;background:var(--bg)}
.qno{font-family:var(--fd);font-weight:800;color:var(--teal);margin-right:6px}
.scorebox{background:linear-gradient(135deg,var(--navy2),var(--head));color:#fff;border-radius:20px;padding:22px;text-align:center;margin-top:18px}
.scorebox .big{font-family:var(--fd);font-size:3.4rem;font-weight:800;color:#ffd770;line-height:1}
.mt{display:grid;grid-template-columns:1fr 1fr;gap:14px;align-items:start}
.mt .sbtn{width:100%;text-align:left;font-weight:700;margin-bottom:8px;border-radius:12px;padding:10px 12px;border:2px solid var(--line);background:var(--card);position:relative}
.mt .sbtn.sel{border-color:var(--navy2);box-shadow:0 0 0 3px var(--soft)}
.mt .sbtn.ok{border-color:var(--teal);background:var(--ok-bg)} .mt .sbtn.bad{border-color:var(--coral);background:var(--bad-bg)}
.mt .pbtn{position:relative;width:100%;background:#fff;border:2px solid var(--line);border-radius:12px;height:86px;margin-bottom:8px;display:grid;place-items:center;padding:3px}
.mt .pbtn img{max-height:76px;object-fit:contain}
.mt .pbtn .L{position:absolute;left:6px;top:4px;font-weight:800;color:#5d6a86;font-size:.85rem}
.mt .pbtn .N{position:absolute;right:6px;top:4px;background:var(--navy2);color:#fff;border-radius:99px;min-width:22px;height:22px;display:grid;place-items:center;font-size:.8rem;font-weight:800}
.mt .N[hidden]{display:none}
.note{background:var(--softgold);border-radius:14px;padding:10px 14px;font-size:.92rem;margin:10px 0}
#fw{position:fixed;inset:0;width:100%;height:100%;pointer-events:none;z-index:50}
.toast{position:fixed;left:50%;top:calc(env(safe-area-inset-top,0px) + 120px);transform:translateX(-50%) scale(.9);background:var(--gold);color:#182a4d;font:800 2rem var(--fd);padding:10px 30px;border-radius:99px;z-index:60;opacity:0;pointer-events:none;transition:.25s;box-shadow:0 10px 30px rgba(0,0,0,.25)}
.toast.show{opacity:1;transform:translateX(-50%) scale(1)}
.modal{position:fixed;inset:0;background:rgba(10,18,40,.6);z-index:40;display:grid;place-items:center;padding:16px}
.modal .card{max-width:560px;width:100%;max-height:92vh;overflow:auto;position:relative}
.x{position:absolute;right:12px;top:10px;border:0;background:var(--soft);width:36px;height:36px;border-radius:50%;font-weight:800}
@media (max-width:700px){
  .hero{grid-template-columns:1fr} .pcard{grid-template-columns:1fr} .stu{grid-template-columns:1fr}
  .mem{grid-template-columns:repeat(3,1fr)} .brand{font-size:1.2rem}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>

</head>
<body>
<canvas id="fw"></canvas><div class="toast" id="toast">Great job!</div>
<header><div class="wrap">
  <div class="top">
    <div class="brand"><i>A</i><div>Ôn Tập Tiếng Anh 2<small>Global Success · Học kỳ 1</small></div></div>
    <div class="stars" id="stars" title="Số sao đã kiếm được">★ 0</div>
  </div>
  <nav id="nav" aria-label="Menu chính"></nav>
</div></header>
<main class="wrap" id="app"></main>

function mkChoice(it,onPick,showOpts){
  let sel=-1;const box=h('div',{class:'opts'});const btns=[];
  const f=it.opts.map((o,i)=>{const b=h('button',{type:'button',class:'opt'+(it.t==='pic'?' img':''),onclick:()=>{if(box.dataset.lock)return;sel=i;btns.forEach((x,j)=>x.classList.toggle('sel',j===i));it.onSel&&it.onSel(o);if(it.t==='pic'||it.t==='word'||it.t==='gap'||it.t==='letter')it.sayOpt&&speak(o);onPick&&onPick()}},it.t==='pic'?image(o):o);btns.push(b);return b});
  box.append(...btns);
  return {box,check(){box.dataset.lock=1;btns.forEach((b,i)=>{b.classList.remove('sel');if(i===it.ans)b.classList.add('ok');else if(i===sel)b.classList.add('bad')});return {got:sel===it.ans?1:0,total:1}},answered:()=>sel>=0,show(){}}
}

    api={el,check:()=>{const r=c.check();bl.textContent=it.opts[it.ans];return r},answered:c.answered,auto:true};
  }else if(it.t==='spell'){

    const hid=it.hidden;// optional set of hidden indexes

      else{const inp=h('input',{maxlength:1,autocomplete:'off',autocapitalize:'off','aria-label':'chữ '+(i+1),oninput:()=>{inp.value=inp.value.toLowerCase();const k=ins.indexOf(inp);if(inp.value&&ins[k+1])ins[k+1].focus();onPick&&onPick(true)},onkeydown:e=>{const k=ins.indexOf(inp);if(e.key==='Backspace'&&!inp.value&&ins[k-1])ins[k-1].focus()}});inp._i=i;ins.push(inp);boxes.append(inp)}
    }
    const pre=it.pre||'',post=it.post||'';
    el.append(it.pic?h('div',{class:'pic'},image(it.pic)):'',h('div',{class:'sent'},pre,boxes,post));
    api={el,answered:()=>ins.every(i=>i.value),check(){let ok=0;ins.forEach(i=>{const g=i.value.toLowerCase()===w[i._i];i.classList.add(g?'ok':'bad');if(g)ok++;i.disabled=true});
      if(ok<ins.length){const s=h('div',{class:'fb no'},'Đáp án: ',h('b',{},w));el.append(s)}return{got:ok===ins.length?1:0,total:1}},auto:false};
  }else if(it.t==='order'){
    const toks=it.words,bank=h('div',{class:'bank'}),ans=h('div',{class:'ans'});let locked=false;
    const mk=(t)=>{const b=h('button',{type:'button',class:'tk',onclick:()=>{if(locked)return;(b.parentNode===bank?ans:bank).append(b);onPick&&onPick(true)}},t);return b};
    shuf(toks).forEach(t=>bank.append(mk(t)));
    el.append(it.pic?h('div',{class:'pic'},image(it.pic)):'',h('div',{class:'instr',style:'text-align:center'},'Sắp xếp thành câu đúng'),ans,bank);
    api={el,answered:()=>bank.children.length===0,check(){locked=true;const g=[...ans.children].map(b=>b.textContent).join(' ');const ok=g===toks.join(' ');ans.classList.add(ok?'ok':'bad');if(!ok)el.append(h('div',{class:'fb no'},'Đáp án: ',h('b',{},toks.join(' '))));return{got:ok?1:0,total:1}},auto:false};
  }else if(it.t==='match'){
    const n=it.pairs.length,map={};const L=h('div'),R=h('div');let cur=-1;const sb=[],pb={};
    it.pairs.forEach((p,i)=>{const b=h('button',{type:'button',class:'sbtn',onclick:()=>{cur=i;sb.forEach((x,j)=>x.classList.toggle('sel',j===i))}},h('span',{class:'qno'},(i+1)+'.'),p.text,' ',spk(p.text.replace(/^A: /,'').replace(' B: ',' ')));sb.push(b);L.append(b)});
    it.pics.forEach(k=>{const lab='abcd'[it.pics.indexOf(k)];const nb=h('span',{class:'N',hidden:true});const b=h('button',{type:'button',class:'pbtn',onclick:()=>{if(cur<0)return;for(const i in map)if(map[i]===lab)delete map[i];map[cur]=lab;sb[cur].classList.remove('sel');cur=-1;refresh()}},h('span',{class:'L'},lab+'.'),image(k),nb);pb[lab]=nb;R.append(b)});

  }

}

/* ---------- QUESTION GENERATORS ---------- */
function picOpts(w,pool){const o=shuf(pool.filter(x=>x.w!==w.w)).slice(0,2).map(x=>x.pic);const all=shuf([w.pic,...o]);return{opts:all,ans:all.indexOf(w.pic)}}
const qPic=(w,pool)=>({t:'pic',say:w.w,...picOpts(w,pool)});
const qWord=(w,pool)=>{const o=shuf([w.w,...shuf(pool.filter(x=>x.w!==w.w)).slice(0,2).map(x=>x.w)]);return{t:'word',pic:w.pic,opts:o,ans:o.indexOf(w.w)}};
const qSpell=(w,hidden)=>{if(hidden){const idx=[...Array(w.w.length).keys()];const hd=shuf(idx).slice(0,Math.min(2,Math.max(1,Math.floor(w.w.length/3))));return{t:'spell',pic:w.pic,word:w.w,hidden:hd}}return{t:'spell',pic:w.pic,word:w.w,show:1}};
const qScr=(w)=>({t:'order',pic:w.pic,words:w.w.split('')});
const qLetter=(w,pool)=>{const L=w.w[0];const other=shuf([...new Set(pool.map(x=>x.w[0]))].filter(l=>l!==L).concat(['f','g','m','b'].filter(l=>l!==L)))[0];const o=shuf([L,other]);return{t:'letter',say:`${L.toUpperCase()}, ${L}, ${w.w}.`,opts:o,ans:o.indexOf(L)}};
function qGap(units){const u=rnd(units);const [text,a]=rnd(u.gap);const wr=u.words.map(x=>x[0]);const o=shuf(wr);return{t:'gap',text,pic:a,opts:o,ans:o.indexOf(a)}}
function qSent(units){const u=rnd(units);const s=rnd(u.pat.filter(p=>p[0].split(' ').length>=3).length?u.pat.filter(p=>p[0].split(' ').length>=3):u.pat)[0];return{t:'order',words:s.split(' ')}}
function pick(arr,n){const r=[];let a=shuf(arr);while(r.length<n)r.push(...a.slice(0,n-r.length)),a=shuf(arr);return r}
function makeGame(kind,sc,n=10){const pool=wordsOf(sc),us=unitsOf(sc);const ws=pick(pool,n);
 return ws.map((w,i)=>({pic:()=>qPic(w,pool),word:()=>qWord(w,pool),spell:()=>qSpell(w),miss:()=>qSpell(w,true),scr:()=>qScr(w),gap:()=>qGap(us),sent:()=>qSent(us)})[kind]())}

   ['🪢','Treo cổ (Hangman)','Đoán chữ trước khi hết tim',()=>gHang(sc)],
   ['🔍','Ô chữ','Tìm từ trong bảng chữ',()=>gSearch(sc)],
   ['⭕','Cờ ca-rô','Trả lời đúng để đánh dấu X',()=>gTTT(sc)]];
  const back=()=>{app.replaceChildren();VIEWS.games()};
  const draw=()=>{box.replaceChildren(scopeBar(sc,id=>{sc=id;draw()}));tiles.replaceChildren(...G.map(([ic,t,d,f])=>h('button',{class:'gt',onclick:()=>{app.replaceChildren();f()}},h('span',{class:'ic'},ic),h('span',{},h('b',{},t),h('small',{},d)))))};
  draw();app.append(h('h2',{},'Trò chơi ôn tập'),h('p',{class:'sub'},'Chọn phạm vi ôn rồi chọn trò chơi. Làm đúng sẽ có âm thanh "Great job!" và pháo hoa.'),box,tiles);
},
tests(){
  const t=(n,d,f,b)=>h('div',{class:'tcard'},h('h3',{},n),h('p',{},d),h('button',{class:'btn',onclick:f},b));
  app.append(h('h2',{},'Bài kiểm tra'),h('p',{class:'sub'},'Học sinh làm bài rồi bấm "Nộp bài", máy sẽ chấm điểm thang 10 ngay.'),
   h('div',{class:'tgrid'},
    t('Đề giữa kỳ I (đề gốc)','Đủ 4 bài: Listen and circle, Listen and tick, Read and match, Look and write.',()=>runTest(officialTest(),()=>{app.replaceChildren();VIEWS.tests()}),'Làm bài'),
    t('Đề ôn giữa kỳ','Đề mới ngẫu nhiên, Unit 1–4, 20 câu. Mỗi lần bấm là một đề khác.',()=>{const mk=()=>genTest('mid','ĐỀ ÔN TẬP GIỮA KỲ I');runTest(mk(),()=>{app.replaceChildren();VIEWS.tests()},mk)},'Ra đề mới'),
    t('Đề ôn cuối kỳ','Đề mới ngẫu nhiên, Unit 1–8, 20 câu. Mỗi lần bấm là một đề khác.',()=>{const mk=()=>genTest('final','ĐỀ ÔN TẬP CUỐI KỲ I');runTest(mk(),()=>{app.replaceChildren();VIEWS.tests()},mk)},'Ra đề mới')));
}};

/* ---------- FLASHCARDS ---------- */
function flashcards(ws){let i=0;const m=$('#modal');
  const draw=()=>{const w=ws[i];m.replaceChildren(h('div',{class:'modal',onclick:e=>{if(e.target.classList.contains('modal'))m.replaceChildren()}},h('div',{class:'card'},h('button',{class:'x','aria-label':'Đóng',onclick:()=>m.replaceChildren()},'✕'),
    h('div',{class:'flash'},h('span',{class:'ubadge'},`Unit ${w.u} · ${i+1}/${ws.length}`),h('div',{class:'pic'},image(w.pic)),h('div',{class:'w'},w.w),h('div',{class:'sub',style:'margin:0'},w.vi),spk(w.w,true),
     h('div',{class:'actions'},h('button',{class:'btn alt',disabled:i===0,onclick:()=>{i--;draw()}},'‹ Trước'),h('button',{class:'btn',disabled:i===ws.length-1,onclick:()=>{i++;draw()}},'Tiếp ›'))))));speak(w.w)};
  draw()}

/* ---------- QUIZ RUNNER (phản hồi ngay) ---------- */
function runQuiz(root,title,qs,back){root.replaceChildren();let i=0,score=0;const st=h('div',{class:'stage'});root.append(st);
  const step=()=>{if(i>=qs.length)return end();const it=qs[i];let done=false;
    const bar=h('div',{class:'bar'},h('i',{style:`width:${i/qs.length*100}%`}));const fb=h('div',{class:'fb'});
    const fin=()=>{if(done)return;done=true;const r=api.check();const ok=r.got===r.total;if(ok){score++;good();fb.className='fb good';fb.textContent='Chính xác!'}else{bad();fb.className='fb no';fb.textContent='Chưa đúng, xem đáp án nhé.'}
      acts.replaceChildren(h('button',{class:'btn',onclick:()=>{i++;step()}},i===qs.length-1?'Xem kết quả':'Câu tiếp ›'))};
    const api=buildItem(it,(typing)=>{if(api.auto&&!typing)setTimeout(fin,250)});
    const acts=h('div',{class:'actions'},api.auto?'':h('button',{class:'btn',onclick:()=>{if(!api.answered()){fb.className='fb no';fb.textContent='Hãy hoàn thành đáp án trước nhé.';return}fin()}},'Kiểm tra'));
    st.replaceChildren(h('div',{class:'qh'},h('h2',{},title),h('b',{},`Câu ${i+1}/${qs.length} · Đúng ${score}`)),bar,api.el,fb,acts,h('div',{class:'actions'},h('button',{class:'btn alt',onclick:back},'‹ Thoát')));
    if(it.say)setTimeout(()=>speak(it.say),300);if(it.t==='spell'||it.t==='order'||it.t==='gap'||it.t==='word'){const inp=st.querySelector('input');inp&&inp.focus()}};
  const end=()=>{const s=Math.round(score/qs.length*10);const big=score/qs.length>=.7;if(big){good(true)}else{chime()}addStar(Math.round(score/2));
    st.replaceChildren(h('div',{class:'card result'},h('div',{class:'stars-row'},'★'.repeat(Math.max(1,Math.round(score/qs.length*3)))+'☆'.repeat(3-Math.max(1,Math.round(score/qs.length*3)))),h('div',{class:'big'},score+'/'+qs.length),h('p',{},big?'Great job! Bạn làm rất tốt!':'Cố gắng thêm nhé, bạn sẽ làm tốt hơn!'),
      h('div',{class:'actions'},h('button',{class:'btn',onclick:()=>runQuiz(root,title,qs.map(q=>({...q})).sort(()=>Math.random()-.5),back)},'Chơi lại'),h('button',{class:'btn alt',onclick:back},'Về danh sách'))))};
  step()}

/* ---------- GAMES RIÊNG ---------- */
function shell(title,back){const st=h('div',{class:'stage'});app.append(st);return{st,head:()=>h('div',{class:'qh'},h('h2',{},title),h('button',{class:'btn alt',onclick:back},'‹ Thoát'))}}
const backG=()=>{app.replaceChildren();VIEWS.games()};
function gMatch(sc){const {st,head}=shell('Nối tranh – từ',backG);const ws=pick(wordsOf(sc),6).filter((w,i,a)=>a.findIndex(x=>x.w===w.w)===i);let cur=null,done=0;
  const L=h('div',{class:'col'}),R=h('div',{class:'col'});
  shuf(ws).forEach(w=>L.append(h('button',{type:'button',class:'opt img','data-w':w.w,onclick:e=>{cur=e.currentTarget;L.querySelectorAll('.opt').forEach(x=>x.classList.remove('sel'));cur.classList.add('sel');speak(w.w)}},image(w.pic))));
  shuf(ws).forEach(w=>R.append(h('button',{type:'button',class:'opt','data-w':w.w,onclick:e=>{const b=e.currentTarget;if(!cur)return;if(cur.dataset.w===b.dataset.w){cur.classList.add('done');b.classList.add('done');cur=null;done++;good(done===ws.length);if(done===ws.length)fb.textContent='Hoàn thành! Great job!'}else{bad();cur.classList.remove('sel');cur=null}}},w.w)));
  const fb=h('div',{class:'fb good'});st.append(head(),h('p',{class:'sub'},'Bấm vào tranh, rồi bấm vào từ đúng.'),h('div',{class:'mm'},L,R),fb,h('div',{class:'actions'},h('button',{class:'btn',onclick:()=>{app.replaceChildren();gMatch(sc)}},'Chơi lại')))}
function gMemory(sc){const {st,head}=shell('Lật thẻ trí nhớ',backG);const ws=shuf(wordsOf(sc)).slice(0,6);
  let cards=shuf(ws.flatMap(w=>[{w:w.w,k:'p',pic:w.pic},{w:w.w,k:'t'}]));let open=[],lock=false,found=0;const g=h('div',{class:'mem'});
  cards.forEach(c=>{const b=h('button',{type:'button',class:'mc','aria-label':'thẻ úp',onclick:()=>{if(lock||b.classList.contains('up')||b.classList.contains('done'))return;b.classList.add('up');b.replaceChildren(c.k==='p'?image(c.pic):h('span',{},c.w));if(c.k==='t')speak(c.w);open.push([b,c]);
    if(open.length===2){lock=true;const [[b1,c1],[b2,c2]]=open;if(c1.w===c2.w&&c1.k!==c2.k){setTimeout(()=>{b1.classList.add('done');b2.classList.add('done');open=[];lock=false;found++;good(found===ws.length)},400)}else setTimeout(()=>{[b1,b2].forEach(x=>{x.classList.remove('up');x.textContent='?'});open=[];lock=false},900)}}},'?');g.append(b)});
  st.append(head(),h('p',{class:'sub'},'Lật hai thẻ để tìm cặp: tranh và từ giống nhau.'),g,h('div',{class:'actions'},h('button',{class:'btn',onclick:()=>{app.replaceChildren();gMemory(sc)}},'Chơi lại')))}
function gHang(sc){const {st,head}=shell('Treo cổ (Hangman)',backG);const w=rnd(wordsOf(sc));let lives=6,got=new Set(),end=false;
  const word=h('div',{class:'hmword'}),kb=h('div',{class:'kb'}),hearts=h('div',{class:'hearts'}),fb=h('div',{class:'fb'});
  const draw=()=>{word.replaceChildren(...[...w.w].map(c=>h('span',{},got.has(c)?c:'')));hearts.textContent='❤'.repeat(lives)+'♡'.repeat(6-lives)};
  'abcdefghijklmnopqrstuvwxyz'.split('').forEach(c=>kb.append(h('button',{type:'button',onclick:e=>{if(end||e.target.disabled)return;e.target.disabled=true;if(w.w.includes(c)){got.add(c);e.target.classList.add('ok');if([...w.w].every(x=>got.has(x))){end=true;good(true);fb.className='fb good';fb.textContent='Bạn đã đoán đúng: '+w.w;speak(w.w)}else{chime()}}else{e.target.classList.add('bad');lives--;buzz();if(!lives){end=true;fb.className='fb no';fb.textContent='Hết tim! Từ đúng là: '+w.w;[...w.w].forEach(x=>got.add(x))}}draw()}},c)));
  draw();st.append(head(),h('div',{class:'hm'},h('div',{class:'pic q',style:'padding:8px'},h('div',{class:'pic',style:'margin:0'},image(w.pic))),hearts,word,kb,fb,h('div',{class:'actions'},spk(w.w),h('button',{class:'btn',onclick:()=>{app.replaceChildren();gHang(sc)}},'Từ khác'))))}
function gSearch(sc){const {st,head}=shell('Ô chữ',backG);const N=9;const ws=shuf(wordsOf(sc)).map(x=>x.w).filter(w=>w.length<=N).slice(0,5);
  const g=Array.from({length:N},()=>Array(N).fill(''));const place=[];
  ws.forEach(w=>{for(let t=0;t<60;t++){const d=Math.random()<.5?[0,1]:[1,0];const r=Math.floor(Math.random()*(N-d[0]*(w.length-1))),c=Math.floor(Math.random()*(N-d[1]*(w.length-1)));let ok=true;for(let k=0;k<w.length;k++){const x=g[r+d[0]*k][c+d[1]*k];if(x&&x!==w[k])ok=false}if(ok){for(let k=0;k<w.length;k++)g[r+d[0]*k][c+d[1]*k]=w[k];place.push({w,r,c,d});break}}});
  const letters='abcdefghijklmnopqrstuvwxyz';for(let r=0;r<N;r++)for(let c=0;c<N;c++)if(!g[r][c])g[r][c]=letters[Math.floor(Math.random()*26)];
  const grid=h('div',{class:'ws',style:`grid-template-columns:repeat(${N},auto)`}),cells=[];let first=null,found=0;const wl=h('div',{class:'wl'});const tags={};
  place.forEach(p=>{tags[p.w]=h('span',{},p.w);wl.append(tags[p.w])});
  for(let r=0;r<N;r++)for(let c=0;c<N;c++){const b=h('button',{type:'button',onclick:()=>{if(!first){first=[r,c];b.classList.add('st');return}const [r0,c0]=first;cells[r0][c0].classList.remove('st');first=null;
    const hit=place.find(p=>!p.done&&((p.r===r0&&p.c===c0&&p.r+p.d[0]*(p.w.length-1)===r&&p.c+p.d[1]*(p.w.length-1)===c)||(p.r===r&&p.c===c&&p.r+p.d[0]*(p.w.length-1)===r0&&p.c+p.d[1]*(p.w.length-1)===c0)));
    if(hit){hit.done=1;for(let k=0;k<hit.w.length;k++)cells[hit.r+hit.d[0]*k][hit.c+hit.d[1]*k].classList.add('fd');tags[hit.w].classList.add('fd');found++;speak(hit.w);good(found===place.length)}else bad()}},g[r][c]);(cells[r]=cells[r]||[]).push(b);grid.append(b)}
  st.append(head(),h('p',{class:'sub'},'Bấm chữ đầu rồi bấm chữ cuối của từ (ngang hoặc dọc).'),wl,grid,h('div',{class:'actions'},h('button',{class:'btn',onclick:()=>{app.replaceChildren();gSearch(sc)}},'Bảng mới')))}
function gTTT(sc){const {st,head}=shell('Cờ ca-rô',backG);const pool=wordsOf(sc);const b=Array(9).fill('');let over=false;const grid=h('div',{class:'ttt'}),fb=h('div',{class:'fb'}),qa=h('div');
  const L=[[0,1,2],[3,4,5],[6,7,8],[0,3,6],[1,4,7],[2,5,8],[0,4,8],[2,4,6]];const win=p=>L.some(l=>l.every(i=>b[i]===p));
  const draw=()=>{[...grid.children].forEach((x,i)=>{x.textContent=b[i];x.className=b[i]})};
  const cpu=()=>{const e=b.map((v,i)=>v?-1:i).filter(i=>i>=0);if(!e.length)return;let m=null;for(const p of ['O','X']){for(const i of e){b[i]=p;const w=win(p);b[i]='';if(w){m=i;break}}if(m!==null)break}if(m===null)m=e.includes(4)?4:rnd(e);b[m]='O';draw();if(win('O')){over=true;fb.className='fb no';fb.textContent='Máy thắng rồi. Chơi lại nhé!'}};
  const ask=(i)=>{const w=rnd(pool);const it=Math.random()<.5?qPic(w,pool):qWord(w,pool);qa.replaceChildren();let done=false;const api=buildItem(it,()=>{if(done)return;done=true;setTimeout(()=>{const r=api.check();qa.replaceChildren();if(r.got){b[i]='X';draw();good(win('X'));if(win('X')){over=true;fb.className='fb good';fb.textContent='Bạn thắng! Great job!';return}if(b.every(Boolean)){fb.textContent='Hòa!';return}cpu()}else{bad();fb.className='fb no';fb.textContent='Chưa đúng, thử ô khác nhé.'}},500)});qa.append(api.el);if(it.say)speak(it.say)};
  for(let i=0;i<9;i++)grid.append(h('button',{type:'button','aria-label':'ô '+(i+1),onclick:()=>{if(over||b[i])return;fb.textContent='';ask(i)}}));
  st.append(head(),h('p',{class:'sub'},'Bấm một ô và trả lời đúng để đánh dấu X. Nối 3 ô thẳng hàng để thắng.'),grid,fb,qa,h('div',{class:'actions'},h('button',{class:'btn',onclick:()=>{app.replaceChildren();gTTT(sc)}},'Chơi lại')))}

/* ---------- BÀI KIỂM TRA ---------- */
function runTest(test,back,regen){app.replaceChildren();window.scrollTo(0,0);
  const apis=[];const paper=h('div',{class:'paper'});const mark=h('div',{class:'mark'},'');
  const total=test.sections.reduce((s,x)=>s+x.items.reduce((a,i)=>a+(i.t==='match'?i.pairs.length:1),0),0);
  paper.append(h('div',{class:'qh'},h('h2',{},test.title),h('button',{class:'btn alt',onclick:back},'‹ Thoát')),
    h('div',{class:'stu'},h('div',{},h('label',{for:'fn'},'Full name'),h('input',{id:'fn',autocomplete:'off'})),h('div',{},h('label',{for:'cl'},'Class'),h('input',{id:'cl',autocomplete:'off'})),h('div',{},h('label',{},'Mark'),mark)),
    h('div',{class:'note'},`Bài có ${total} ý, thang điểm 10. Bấm nút loa để nghe, có thể nghe lại nhiều lần.`));
  test.sections.forEach(s=>{const sec=h('div',{class:'sec'},h('h3',{},h('b',{},s.t),h('span',{},s.title+' ',h('small',{style:'color:var(--mute);font-family:var(--fb);font-weight:600'},'· '+s.vi))));
    s.items.forEach((it,k)=>{const a=buildItem(it);a.el.prepend(h('div',{class:'instr'},h('span',{class:'qno'},(s.items.length>1&&it.t!=='match'?(k+1)+'.':''))));apis.push(a);sec.append(a.el)});paper.append(sec)});
  const res=h('div'),submit=h('button',{class:'btn',onclick:()=>{
    let got=0,tot=0;apis.forEach(a=>{const r=a.check();got+=r.got;tot+=r.total});
    const sc=Math.round(got/tot*10*2)/2;mark.textContent=sc+'/10';submit.disabled=true;
    res.replaceChildren(h('div',{class:'scorebox'},h('div',{},'Kết quả của bạn'),h('div',{class:'big'},sc+'/10'),h('p',{},`Đúng ${got}/${tot} ý. `+(sc>=9?'Xuất sắc! Great job!':sc>=7?'Làm tốt lắm! Well done!':sc>=5?'Khá tốt, ôn thêm một chút nhé!':'Cố gắng ôn lại rồi làm lại nhé!')),
      h('div',{class:'actions'},regen?h('button',{class:'btn',onclick:()=>runTest(regen(),back,regen)},'Ra đề mới'):h('button',{class:'btn',onclick:()=>runTest(officialTest(),back)},'Làm lại'),h('button',{class:'btn alt',onclick:back},'Về danh sách'))));
    if(sc>=5){good(true)}else{buzz()}addStar(Math.round(sc/2));res.scrollIntoView({behavior:'smooth',block:'center'})}},'Nộp bài và chấm điểm');
  paper.append(h('div',{class:'actions',style:'margin-top:24px'},submit),res);app.append(paper)}

route();
addEventListener('pointerdown',()=>{try{AC=AC||new (window.AudioContext||window.webkitAudioContext)();AC.state==='suspended'&&AC.resume()}catch(e){}},{once:true});
$('#stars').textContent='★ '+stars;
